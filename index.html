<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container {
            display: flex;
            margin: 0;
            padding: 0;
            justify-content: space-between;
            margin: 0px 20px;
            border: 2px solid;
            background-color: rgb(132, 170, 132);
            padding: 20px;

        }

        ul {
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
            background-color: red;

        }

        h1 {
            background-color: yellow;
            margin: 0;
            padding: 0;
        }

        #hero {
            display: flex;
            gap: 10px;
            border: 2px solid orange;
            background-color: rgb(117, 53, 196);
        }

        .left {
            flex: 1;
            border: 2px solid brown;
        }

        .right {
            flex: 1;
             
            border: 2px solid green;
           
        }
        img{
            
             height: 90%;
             width:90%
        }
    </style>
</head>

<body>
    <div id="container">
        <h1>LOGO</h1>

        <ul>
            <li>HOME</li>
            <li>service</li>
            <li>contacts</li>
        </ul>
    </div>


    <!-- hero section -->
    <div id="hero">
        <div class="left">
            <h2>welcome👋</h2>
        </div>
        <div class="right">
            <img src="https://randomuser.me/api/portraits/men/1.jpg
" alt="hero">
            <p>my image</p>
        </div>
    </div>
</body>

</html>
