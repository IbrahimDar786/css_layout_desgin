<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container {
            display: flex;
            margin: 0;
            padding: 0;
            justify-content: space-between;
            margin: 0px 20px;
            border: 2px solid;
            background-color: rgb(132, 170, 132);
            padding: 20px;

        }

        ul {
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
            background-color: red;

        }

        h1 {
            background-color: yellow;
            margin: 0;
            padding: 0;
        }

        #hero {
            display: flex;
            gap: 10px;
            border: 2px solid orange;
            background-color: rgb(117, 53, 196);
        }


        #hero>.right>p:hover {
            color: green;
        }

        .left {
            flex: 1;
            border: 2px solid brown;
        }

        .right {
            flex: 1;

            border: 2px solid green;

        }

        img {

            height: 90%;
            width: 90%
        }

        #kuch>span>span {
            border: 2px solid red;
        }

        #kuch>span>h1 {
            border: 2px solid green;
        }

        #kuch>span>h1:hover {
            background-color: #fff;
        }

        div:hover {
            border: 5px solid pink;
        }
    </style>
</head>

<body>
    <div id="container">
        <h1>LOGO</h1>

        <ul>
            <li>HOME</li>
            <li>service</li>
            <li>contacts</li>
        </ul>
    </div>


    <!-- hero section -->
    <div id="hero">
        <div class="left">
            <h2>welcome👋</h2>
        </div>
        <div class="right">
            <img src="https://randomuser.me/api/portraits/men/1.jpg
" alt="hero">
            <p>my image</p>
        </div>
    </div>

    <div id="kuch">
        <span>
            Span #1, in the div.
            <span>Span #2, in the span that's in the div.</span>
            <h1>I am h1</h1>
        </span>
    </div>
    <span>Span #3, not in the div at all.</span>
</body>

</html>
